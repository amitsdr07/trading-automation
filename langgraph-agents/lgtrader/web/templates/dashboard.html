<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LangGraph Trader - Dashboard</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <header>
    <h1>LangGraph Trader - Dashboard</h1>
    <div class="auth">
      <label>API Key: <input id="apiKey" type="password" placeholder="paste API key if required"></label>
      <button id="saveKey">Save</button>
      <span id="status"></span>
    </div>
  </header>

  <main>
    <section>
      <h2>Equity Curve</h2>
      <canvas id="equityChart" width="800" height="320"></canvas>
    </section>

    <section>
      <h2>Latest Positions</h2>
      <table id="positions"><thead><tr>
        <th>Symbol</th><th>Side</th><th>Qty</th><th>Avg Price</th><th>Timestamp</th>
      </tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>Recent Orders</h2>
      <table id="orders"><thead><tr>
        <th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>Status</th><th>Strategy</th>
      </tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>Logs</h2>
      <table id="logs"><thead><tr><th>Time</th><th>Data</th></tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>Report</h2>
      <a href="/report" target="_blank">Open day_report.md</a> · 
      <a href="/equity_chart" target="_blank">Open equity_curve.png</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
